<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Github Icon.">
  <meta name="keywords" content="Github trademark Icon">
  <meta name="author" content="LNSY">
  <meta name="robots" content="index, follow">

  <!-- Open Graph meta tags for better sharing on social media -->
  <meta property="og:title" content="Simple Github Icon">
  <meta property="og:description" content="Simple Github Icon. Created by LNSY.">
  <meta property="og:url" content="https://lnsy.dev"> <!-- Replace with your actual URL -->

  <title>Simple Github Icon</title>
  <link rel="stylesheet" type="text/css" href="./styles/index.css">
  <script src="./src/index.js" type="module"></script>
  <style>
    html {
      color-scheme: light dark;
    }
    body {
      font-family: sans-serif;
      margin-top: 4em;
    }
    article {
      margin: auto;
      width: 40em;
    }

    github-icon {
      float: left;
    }

    .demo {
      width: 10em;
      aspect-ratio: 1;
      padding: 2em;
      margin: auto;
      text-align: center;
    }

    .demo github-icon {
      float: none;
      width: 6em;
      margin: 0 auto;
    }

    .demo figcaption {
      clear: both;
      margin-top: 1em;
    }

    #github-icon {
      width: 3em;
      position: fixed;
      right: 0.25em;
      top: 0.25em;
    }
  </style>
</head>
<body>

<github-icon href="https://github.com/lnsy-dev/simple-github-icon" id="github-icon"></github-icon>
<article>
  <h1>Simple Github Icons</h1>
  <p>I am not associated with Github. The Github logo is trademarked. Download the original files  <a href="https://github.com/logos">here</a>.</p>
<figure class="demo">
  <github-icon href="https://github.com/lnsy-dev/simple-github-icon.git"></github-icon>
  <figcaption>system (default)</figcaption>
</figure>
<figure class="demo" style="background-color:black;">
  <github-icon light href="https://github.com/lnsy-dev/simple-github-icon.git"></github-icon>
  <figcaption style="color:white;">light</figcaption>
</figure>
<figure class="demo" style="background-color:white;">
  <github-icon dark href="https://github.com/lnsy-dev/simple-github-icon.git"></github-icon>
  <figcaption style="color:black;">dark</figcaption>
</figure>

</article>

<footer style="text-align:center; margin-top: 4em">
  <a href="https://lnsy.dev/" target="_blank">Hire Me!</a>
</footer>


</body>
</html>
